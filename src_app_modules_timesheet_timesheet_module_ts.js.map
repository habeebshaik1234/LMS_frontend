<div fxLayout="Column" class="dashboard-content">
  <mat-card class="sidePad">
    <form [formGroup]="dashBoardForm" fxLayout="Column">

      <div fxLayout="row" fxLayoutAlign="space-between center">
        <span fxLayoutAlign="start">
          <mat-form-field class="mx-2 my-2" appearance="outline">
            <mat-label>Date</mat-label>
            <mat-select formControlName="DateFormate">
              <mat-option value="currentWeek"> Current Week</mat-option>
              <mat-option value="lastWeek">Last Week</mat-option>
              <mat-option value="currentMonth"> Current Month</mat-option>
              <mat-option value="lastMonth"> Last Month</mat-option>
            </mat-select>
          </mat-form-field>
        </span>
        <span style="padding-right:1%">
          <span style="font-size: large;color:crimson"  (click)="openPendingPopup()"><strong>Pending timesheet count :
              {{ pendingCount }}</strong></span> 
        </span>
      </div>
      <div fxLayout="row" fxLayoutGap="5">
        <div fxFlex="50" fxLayout="row">
          <mat-card class="card outline" fxFlex="100" fxLayout="column" style="height: 500px;">
            <span class="title" fxLayoutAlign="start">
              <span>Task Summary</span>
            </span>&nbsp;

            <div *ngIf="projectHours.length > 0" #chartWrapper class="table-container" style="height: 100%;">
              <div [style.width.px]="chartContainerWidth" style="height: 100%;">
                <canvas baseChart [data]="vbarChartData" [type]="vbarChartType" [options]="vbaroptions"
                  style="width: 100%; height: 100%;">
                </canvas>
              </div>
            </div>

            <div *ngIf="projectHours.length == 0" fxFlex style="flex: 1; width: 100%;" fxLayoutAlign="center">
              <span>No data found</span>
            </div>
          </mat-card>
        </div>

        <div fxFlex="50">
          <mat-card class="card outline" fxFlex="100" fxLayout="column" style="height: 500px;">
            <span class="title" fxLayoutAlign="start">
              <span>Assigned Projects & Task</span>
            </span>&nbsp;
            <div class=" table-container">

              <table cellspacing="0" cellpadding="8" width="100%">
                <thead>
                  <tr style="position: sticky; top: 0; background-color: #fff; z-index: 10;">
                    <th>S.No</th>
                    <th>Project Name</th>
                    <th>Task Name</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngIf="tasktNameList.length === 0">
                    <td colspan="3" style="text-align: center">No data found</td>
                  </tr>
                  <tr *ngFor="let task of tasktNameList; let i = index">
                    <td>{{ i + 1 }}</td>
                    <td>{{ task.project_name }}</td>
                    <td>{{ task.task_name }}</td>
                  </tr>
                </tbody>
              </table>


            </div>
          </mat-card>

        </div>

      </div>






    </form>
  </mat-card>
</div>
