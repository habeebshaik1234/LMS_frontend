<div class="dialog-header">
  <h2>The project cannot be completed </h2>
</div>

<mat-dialog-content class="dialog-content">
  <p class="info-text">The following tasks are still pending:</p>

 <div class="task-list-wrapper">
  <ul class="task-list">
    <li *ngFor="let task of data.tasks">{{ task.taskname }}</li>
  </ul>
</div>
</mat-dialog-content>

<mat-dialog-actions align="center">
  <button mat-raised-button color="primary" class="ok-button" (click)="closeDialog()">
    OK
  </button>
</mat-dialog-actions>
