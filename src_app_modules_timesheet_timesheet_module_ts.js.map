<div fxLayout="column" class="first-col">
    <mat-card class="mt-card mat-elevation-z0">
        <mat-card-header class="mt-card-header" fxLayout="row">
            <mat-card-title class="mt-card-title"> Project Roles </mat-card-title>
        </mat-card-header>
      </mat-card>

    <form [formGroup]="projectRoleForm">
      <mat-form-field appearance="outline" style="width: 350px; margin-left:20px;">
        <mat-label>Role Name </mat-label>
            <input formControlName="role_name" matInput placeholder="Role Name" required onlyAlphabets maxlength="64"
            noLeadingWhitespace #roleNameInput />
            <mat-error
            *ngIf="projectRoleForm.get('role_name')?.touched && projectRoleForm.get('role_name')?.hasError('required')">
            This field is required</mat-error>
            <mat-error *ngIf="projectRoleForm.get('role_name')?.hasError('duplicate')">
            Record already exists
            </mat-error>
          </mat-form-field>
          <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="16px" >
            <button *ngIf="!isEdit && !viewMode" class="btn btn-primary mr-2 mb-2" (click)="submit()" type="button">
              <span>Submit</span>
            </button>
            <button *ngIf="isEdit" class="btn btn-primary" (click)="submit()">Update</button>

            <button class="btn btn-danger mr-2 mb-2" (click)="cancel()">
              <span>Cancel</span>
            </button>
          </div>
       
        </form>
         <!-- Search bar row -->
      <div fxLayout="row" fxLayoutAlign="end center"  fxLayoutGap="8px" class="table-search-row">
      <mat-form-field appearance="outline" fxFlex.gt-sm="25" fxFlex.xs="100" class="mx-2 my-2">
      <mat-icon matSuffix style="color: #28acaf;">search</mat-icon>
      <mat-label>Search</mat-label>
      <input (keyup)="applyFilter($event)" matInput maxlength="100">
    </mat-form-field>
</div>
        
          <div class="mtb-pd1" fxLayout="column">
            <div class="mtb-container mat-elevation-z1">
              <table mat-table [dataSource]="dataSource" class="mat-elevation-z1">

                <!-- S.No Column -->
                <ng-container matColumnDef="sno">
                  <th mat-header-cell *matHeaderCellDef> S.No </th>
                  <td mat-cell *matCellDef="let element; let i = index">
                    {{ (i + 1) + (paginator.pageIndex * paginator.pageSize) }}
                  </td>
                </ng-container>
              
                <!-- Role Name Column -->
                <ng-container matColumnDef="role_name">
                  <th mat-header-cell *matHeaderCellDef> Role Name </th>
                  <td mat-cell *matCellDef="let element">
                    {{ element.role_name }}
                  </td>
                </ng-container>
              
                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef> Actions </th>
                  <td mat-cell *matCellDef="let element">
                    <button mat-icon-button (click)="editRow(element)">
                      <mat-icon>edit</mat-icon>
                    </button>
                  
                  </td>
                </ng-container>
              
                <!-- Header Row -->
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              
                <!-- Data Row -->
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              
                <!-- No Data Row -->
                <tr class="mat-row" *matNoDataRow>
                  <td class="mat-cell" colspan="5" style="text-align: center;">No data found</td>
                </tr>
              
              </table>
              
              <!-- Paginator -->
              <mat-paginator [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
            </div>
