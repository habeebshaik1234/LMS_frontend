<div class="popup-header" style="position: relative; display: flex; align-items: center; justify-content: center;">
  <h2 style="margin:0; text-align:center;">Pending Timesheet Details</h2>
  <button mat-icon-button mat-dialog-close
          style="position: absolute; right: 0;">
    <mat-icon color="warn" matTooltip="Close">cancel</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-body">

  <div class="table-wrapper example-container">

    <!-- HEADER ROW -->
    <div class="table-header row">
      <span class="cell sno">S. No.</span>
      <span class="cell date">Date</span>
      <span class="cell status">Status</span>
    </div>

    <!-- DATA ROWS -->
   <div class="table-row row" *ngFor="let item of pendingDates; let i = index">
  <span class="cell sno">{{ i + 1 }}</span>
  <span class="cell date">{{ item.dateObj | date:'dd-MM-yyyy' }}</span>
  <span
  class="cell status"
  (click)="openTimesheet(item.dateObj)"
  style="cursor: pointer;"
  [ngClass]="{
    'red': item.displayValue.toLowerCase().includes('pending') || item.displayValue.toLowerCase().includes('no submission')
  }">
  {{ item.displayValue }}
 </span>

</div>


    <!-- No data -->
    <div *ngIf="pendingDates.length === 0" class="table-row row">
      <span class="cell sno" colspan="3">No pending timesheets found</span>
    </div>

  </div>

</mat-dialog-content>
