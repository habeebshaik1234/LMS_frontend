
<button mat-icon-button class="close-button" [mat-dialog-close]="true">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
  </button>


<div class="main-Pad"  >
    <form [formGroup]="requestForm" *ngIf="!view">
        <div class="responsive-form" autocomplete="off" style="padding-top: 1%" style="margin: 10px 0px 0px 7px;">
            <mat-form-field class="mx-2 my-2" appearance="outline" style="width:420px">
                <mat-label>Optional Holiday </mat-label>
                <mat-select formControlName="optionalHoliday" required>
                    <input matInput [formControl]="searchControl" type="text" placeholder="  Search"
                    class="search-align">
                    <mat-option *ngFor="let b of filteredOptionalHolidayList" [value]="b.holidayId">{{b.holiday}}{{' - '}}{{b.holidayDate | date:'dd-MM-yyyy' }}</mat-option>
                        <mat-option *ngIf="filteredOptionalHolidayList.length === 0" disabled>
                            No data found
                          </mat-option>
               
                </mat-select>
                <mat-error class="con-error" *ngIf="true">
                    Please select an option.
                </mat-error>
                
            </mat-form-field>
        </div>
        <div class="responsive-form" autocomplete="off"  style="padding-top: 1%" style="margin: 10px 0px 0px 7px;" >
            <mat-form-field class="mx-2 my-2" appearance="outline" style="width:420px">
                <mat-label>Remarks</mat-label>
                <input matInput type="text" formControlName="remarks" maxlength="250" onlyAlphabets>
            </mat-form-field>
        </div>
        <div fxLayoutAlign="center">
            <button class="btn btn-primary mr-2 mb-2" [disabled]="btndisable" matInput
                [ngClass]="{'disable':btndisable}" type="submit" (click)="submit()">
                <span>Submit</span>
            </button>
        </div>
    </form>
<form [formGroup]="displayForm" *ngIf="view">
    <div class="responsive-form" autocomplete="off" style="padding-top: 1%" style="margin: 10px 0px 0px 7px;">
        <mat-form-field class="mx-2 my-2" appearance="outline" style="width:420px">
            <mat-label>Optional Holiday </mat-label>
            <mat-select formControlName="optionalHoliday" [disabled]="true" >
                <mat-option *ngFor="let b of filteredOptionalHolidayList" [value]="b.holidayId">{{b.holiday}}{{' - '}}{{b.holidayDate | date:'dd-MM-yyyy' }}</mat-option>
            </mat-select>   
        </mat-form-field>
    </div>
    <div class="responsive-form" autocomplete="off"  style="padding-top: 1%" style="margin: 10px 0px 0px 7px;" >
        <mat-form-field class="mx-2 my-2" appearance="outline" style="width:420px">
            <mat-label>Remarks</mat-label>
            <input matInput type="text" formControlName="remarks" readonly>
        </mat-form-field>
    </div>
</form>
</div>
