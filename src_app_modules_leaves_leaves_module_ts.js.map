<br>
<mat-tab-group (selectedTabChange)="selectedTabChange($event)" class="custom-tab-group"  [disableRipple]="true">
    <mat-tab label="User Leave List">
        <app-manager-dashboard-calender *ngIf="isLeaveModuleActive"></app-manager-dashboard-calender>
    </mat-tab>
    <mat-tab>
      <ng-template mat-tab-label>
        Pending Requests 
        <span  class="bd-1"
          matBadge="{{ leaveRequestpendingCount }}" 
          *ngIf="leaveRequestpendingCount > 0">
        </span>
      </ng-template>
      <app-pending-approvals (countUpdated)="updatePendingRequestCount($event)"></app-pending-approvals>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        Pending Comp Off 
        <span  class="bd-1"
          matBadge="{{ compoffPendingCount }}" 
          *ngIf="compoffPendingCount > 0">
        </span>
      </ng-template>
      <app-pending-compoff (countUpdated)="updatePendingCompoffCount($event)"></app-pending-compoff>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        Pending Cancellation Requests
        <span  class="bd-1"
          matBadge="{{ leaveCancelPendingCount }}" 
          *ngIf="leaveCancelPendingCount > 0">
        </span>
      </ng-template>
      <app-leaves-for-cancellation (countUpdated)="updatePendingCancelCount($event)"></app-leaves-for-cancellation>
    </mat-tab>
    </mat-tab-group>
